name: Quality Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser modules
        run: |
          for f in src/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Run product smoke checks
        run: node scripts/smoke.mjs
      - name: Check customization storage migration
        run: node scripts/customize-storage-smoke.mjs
      - name: Check server
        run: node --check server/server.js
      - name: Install server dependencies
        working-directory: server
        run: npm install --ignore-scripts
