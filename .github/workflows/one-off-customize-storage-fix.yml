name: One-off Customize Storage Fix

on:
  push:
    branches: [fix/customize-storage-migration]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customize-storage-migration
      - name: Patch customization storage migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          old="const c=k=>C[i18n.lang]?.[k]??C.en[k]??t(k),parse=(v,d)=>{try{return JSON.parse(v)}catch{return d}};"
          new="""const c=k=>C[i18n.lang]?.[k]??C.en[k]??t(k),parse=(v,d)=>{try{return JSON.parse(v)}catch{return d}};
          const avatarData=v=>typeof v==='string'&&/^data:image\\/(?:png|jpeg|webp);base64,/i.test(v);
          function normalizeTemplates(raw){const source=Array.isArray(raw)?raw:(raw&&typeof raw==='object'?Object.values(raw):[]),out=[];for(const entry of source){const src=typeof entry==='string'?entry:(entry&&typeof entry==='object'?(entry.src||entry.data||entry.image):'');if(avatarData(src)&&!out.includes(src))out.push(src)}return out.slice(-12)}
          const storedTemplates=normalizeTemplates(parse(localStorage.getItem('rbf.templates'),[]));let storedActive=localStorage.getItem('rbf.activeAvatar');if(!avatarData(storedActive))storedActive=null;if(storedActive&&!storedTemplates.includes(storedActive))storedTemplates.push(storedActive);try{localStorage.setItem('rbf.templates',JSON.stringify(storedTemplates));if(storedActive)localStorage.setItem('rbf.activeAvatar',storedActive);else localStorage.removeItem('rbf.activeAvatar')}catch{}"""
          if old not in s: raise SystemExit('app parse anchor not found')
          s=s.replace(old,new,1)
          old_state="custom:{templates:parse(localStorage.getItem('rbf.templates'),[]),active:localStorage.getItem('rbf.activeAvatar')||null,uploadUnlocked:sessionStorage.getItem('rbf.uploadUnlocked')==='1'}"
          new_state="custom:{templates:storedTemplates,active:storedActive,uploadUnlocked:sessionStorage.getItem('rbf.uploadUnlocked')==='1'}"
          if old_state not in s: raise SystemExit('custom state anchor not found')
          s=s.replace(old_state,new_state,1)
          old_custom="function customize(){const saved=state.custom.templates.map((src,i)=>"
          new_custom="function customize(){state.custom.templates=normalizeTemplates(state.custom.templates);if(!avatarData(state.custom.active))state.custom.active=null;const saved=state.custom.templates.map((src,i)=>"
          if old_custom not in s: raise SystemExit('customize anchor not found')
          s=s.replace(old_custom,new_custom,1)
          old_bind="function bindCustomize(){try{const cv=root.querySelector('#avatarCanvas'),ctx=cv.getContext('2d'),status=root.querySelector('#customStatus');if(!ctx)throw new Error('canvas context unavailable');"
          new_bind="function bindCustomize(){try{const cv=root.querySelector('#avatarCanvas'),status=root.querySelector('#customStatus');if(!cv)throw new Error('avatar canvas missing');const ctx=cv.getContext?.('2d');if(!ctx)throw new Error('canvas context unavailable');"
          if old_bind not in s: raise SystemExit('bind customize anchor not found')
          s=s.replace(old_bind,new_bind,1)
          old_load="const load=src=>{if(!src)return;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,512,512);ctx.drawImage(img,0,0,512,512)};img.src=src};load(state.custom.active);"
          new_load="const load=src=>{if(!avatarData(src))return;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,512,512);ctx.drawImage(img,0,0,512,512)};img.onerror=()=>{state.custom.active=null;try{localStorage.removeItem('rbf.activeAvatar')}catch{};drawBase(ctx);if(status)status.textContent=c('customError')};img.src=src};load(state.custom.active);"
          if old_load not in s: raise SystemExit('load avatar anchor not found')
          s=s.replace(old_load,new_load,1)
          p.write_text(s)

          q=Path('scripts/smoke.mjs')
          t=q.read_text()
          anchor="assert(app.includes('imageUpload')&&app.includes('rbf.templates')&&app.includes('activeAvatar'),'customization persistence/upload flow missing');"
          extra=anchor+"assert(app.includes('normalizeTemplates')&&app.includes('avatarData'),'customization must sanitize/migrate legacy saved looks');assert(app.includes(\"if(!cv)throw new Error('avatar canvas missing')\"),'customization canvas initialization must be guarded');"
          if anchor not in t: raise SystemExit('smoke customization anchor not found')
          t=t.replace(anchor,extra,1)
          q.write_text(t)
          PY
      - name: Syntax and smoke checks
        run: |
          for f in src/*.js; do node --check "$f"; done
          node scripts/smoke.mjs
      - name: Remove one-off workflow
        run: rm .github/workflows/one-off-customize-storage-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: migrate legacy customize storage safely"
          git push origin HEAD:fix/customize-storage-migration
